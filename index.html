
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title> Configurador de texto </title>
  <link rel="stylesheet" href="style.css" />
  <script src="scrpit.js" defer></script>
</head>
<body>

  <main class="page">
    <section class="card">
      <h1 class="title">Configurador de texto</h1>
      <div class="area-tracejada">

        <div class="substituicao-box">
          <div id="regrasSubstituicao">
            <div class="regra-substituicao">
              <label>
                Substituir:
                <input type="text" class="textoSubstituir" placeholder="Ex.: ,">
              </label>
              <label>
                Por:
                <input type="text" class="novoTexto" placeholder="Ex.: _">
              </label>
            </div>
          </div>
          <button id="btnAdicionarRegra" type="button">Adicionar substituição</button>
        </div>

        <div class="conteudo-central">
          <label for="campoPalavra">Texto:</label>
          <input id="campoPalavra" type="text">

          <button id="btnMostrar" type="button">Converter</button>

          <div class="linha-resultado">
            <span>Resultado: <span id="resultado">...</span></span>
            <button id="btnCopiar" type="button">Copiar resultado</button>
          </div>
          <span id="statusCopia" class="status-copia" aria-live="polite"></span>
        </div>
      </div>
      <p class="creditos">Created by Claudinei Gomes</p>
    </section>
  </main>

</body>
</html>
